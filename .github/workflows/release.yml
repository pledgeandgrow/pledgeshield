          ## Platforms

          | OS | Support |
          |-----|---------|
          | Linux | Full (x86_64, aarch64) |
          | macOS | Full (Intel, Apple Silicon) |
          | Windows | Full (x86_64) |

          ## License

          MIT
          NUGETREADME

          # Create a simple launcher script
          cat > nuget-pkg/tools/pledgeshield.cmd << 'CMD'
          @echo off
          setlocal
          set VERSION=${{ steps.version.outputs.version }}
          set BIN_DIR=%USERPROFILE%\.pledgeshield-bin\%VERSION%
          if exist "%BIN_DIR%\pledgeshield.exe" (
            "%BIN_DIR%\pledgeshield.exe" %*
