  # ──────────────────────────────────────────────
  # Job 9: Update Homebrew tap
  # ──────────────────────────────────────────────
  publish-homebrew:
    name: Update Homebrew tap
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download macOS binaries
        uses: actions/download-artifact@v4
        with:
          name: pledgeshield-darwin-aarch64

      - name: Compute SHA256
        id: sha
        run: |
          SHA=$(shasum -a 256 pledgeshield-darwin-aarch64.tar.gz | awk '{print $1}')
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: Update Homebrew tap
        run: |
          # Clone or create the tap repository
          git clone https://github.com/pledgeandgrow/homebrew-tap.git tap-repo 2>/dev/null || {
            mkdir -p tap-repo
            cd tap-repo
            git init
            git remote add origin https://github.com/pledgeandgrow/homebrew-tap.git
          }

          cd tap-repo
          mkdir -p Formula

          cat > Formula/pledgeshield.rb << 'FORMULA'
          class Pledgeshield < Formula
            desc "Personal device security auditor — finds what antivirus misses"
            homepage "https://github.com/pledgeandgrow/pledgeshield"
            url "https://github.com/pledgeandgrow/pledgeshield/releases/download/v${{ steps.version.outputs.version }}/pledgeshield-darwin-aarch64.tar.gz"
            sha256 "${{ steps.sha.outputs.sha256 }}"
            license "MIT"
            version "${{ steps.version.outputs.version }}"

            def install
              bin.install "pledgeshield"
            end

            def caveats
              <<~EOS
                PledgeShield is ready! Quick start:

                  pledgeshield scan                          # Run a full security audit
                  pledgeshield scan --cve --compliance       # Scan with CVE + compliance mapping
                  pledgeshield harden firewall --harden      # Harden firewall
                  pledgeshield harden posture                # Check security posture score
                  pledgeshield monitor                       # Real-time monitoring

                95+ hardening modules available. Run:
                  pledgeshield harden --help

                Documentation: https://github.com/pledgeandgrow/pledgeshield
              EOS
            end

            test do
              assert_match "pledgeshield", shell_output("#{bin}/pledgeshield --help", 0)
            end
          end
          FORMULA

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/pledgeshield.rb
          git commit -m "Update pledgeshield to v${{ steps.version.outputs.version }}" || true
          git push https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/pledgeandgrow/homebrew-tap.git HEAD:main
        continue-on-error: true

  # ──────────────────────────────────────────────
  # Job 10: Submit winget manifest
  # ──────────────────────────────────────────────
  publish-winget:
    name: Submit to winget
    needs: github-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: pledgeshield-windows-x86_64

      - name: Compute SHA256
        id: sha
        shell: pwsh
        run: |
          $hash = (Get-FileHash pledgeshield-windows-x86_64.zip -Algorithm SHA256).Hash
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/microsoft/winget-create/releases/latest/download/wingetcreate.exe" -OutFile wingetcreate.exe

      - name: Update winget manifest
        shell: pwsh
        run: |
          # Try to update existing manifest, or create new if it doesn't exist
          try {
            .\wingetcreate.exe update PledgeAndGrow.PledgeShield `
              --version ${{ steps.version.outputs.version }} `
              --urls "https://github.com/pledgeandgrow/pledgeshield/releases/download/v${{ steps.version.outputs.version }}/pledgeshield-windows-x86_64.zip|${{ steps.sha.outputs.sha256 }}" `
              --token ${{ secrets.WINGET_GITHUB_TOKEN }} `
              --submit
          } catch {
            # First-time submission: create new manifest
            .\wingetcreate.exe new `
              --id PledgeAndGrow.PledgeShield `
              --version ${{ steps.version.outputs.version }} `
              --package-name "PledgeShield" `
              --publisher "PledgeAndGrow" `
              --publisher-url "https://github.com/pledgeandgrow" `
              --author "mehdi-berel" `
              --homepage "https://github.com/pledgeandgrow/pledgeshield" `
              --description "Personal device security auditor — finds what antivirus misses. Scans for misconfigurations, exposed services, unpatched CVEs, privilege escalation, and hardens 95+ attack surfaces." `
              --short-description "Personal device security auditor" `
              --tags "security" "audit" "hardening" "firewall" "privacy" "vulnerability" "cve" "compliance" "rootkit" "ransomware" `
              --license "MIT" `
              --license-url "https://github.com/pledgeandgrow/pledgeshield/blob/main/LICENSE" `
              --urls "https://github.com/pledgeandgrow/pledgeshield/releases/download/v${{ steps.version.outputs.version }}/pledgeshield-windows-x86_64.zip|${{ steps.sha.outputs.sha256 }}" `
              --token ${{ secrets.WINGET_GITHUB_TOKEN }} `
              --submit
          }
        continue-on-error: true

  # ──────────────────────────────────────────────
  # Job 11: Publish .deb to signed apt repository
  # ──────────────────────────────────────────────
  publish-apt:
    name: Publish signed apt repo
    needs: [build-deb, github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download .deb
        uses: actions/download-artifact@v4
        with:
          name: pledgeshield-deb

      - name: Import GPG signing key
        run: |
          echo "${{ secrets.APT_GPG_KEY }}" | gpg --import --batch --yes
          # Verify key was imported
          gpg --list-secret-keys --keyid-format long

      - name: Set up apt repository
        run: |
          # Create apt repository structure
          mkdir -p apt-repo/pool/main/p/pledgeshield
          mkdir -p apt-repo/dists/stable/main/binary-amd64

          # Copy .deb to pool
          cp *.deb apt-repo/pool/main/p/pledgeshield/

          # Copy public key into repo root (for users to download)
          cp apt/pledgeshield-apt-public.key apt-repo/pledgeshield-apt-public.key

          # Create Packages file
          cd apt-repo
          dpkg-scanpackages --arch amd64 pool /dev/null > dists/stable/main/binary-amd64/Packages
          gzip -k dists/stable/main/binary-amd64/Packages

          # Compute hashes for Release file
          cd dists/stable
          {
            echo "Origin: PledgeAndGrow"
            echo "Label: PledgeShield"
            echo "Suite: stable"
            echo "Codename: stable"
            echo "Version: ${{ steps.version.outputs.version }}"
            echo "Architectures: amd64"
            echo "Components: main"
            echo "Description: PledgeShield — Personal device security auditor. Finds what antivirus misses. Scans for misconfigurations, exposed services, unpatched CVEs, privilege escalation, and hardens 95+ attack surfaces."
            echo "Maintainer: mehdi-berel <mehdi.berel@pledgeandgrow.com>"
            echo "Date: $(date -Ru)"
            echo "MD5Sum:"
            (cd main/binary-amd64 && md5sum Packages Packages.gz)
            echo "SHA1:"
            (cd main/binary-amd64 && sha1sum Packages Packages.gz)
            echo "SHA256:"
            (cd main/binary-amd64 && sha256sum Packages Packages.gz)
          } > Release

          # Sign Release file (detached signature → Release.gpg)
          gpg --batch --yes --armor --detach-sign --output Release.gpg Release

          # Create clear-signed InRelease (inline signed)
          gpg --batch --yes --armor --clearsign --output InRelease Release

          # Verify signatures
          gpg --verify Release.gpg Release
          gpg --verify InRelease

      - name: Deploy apt repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt-repo
          destination_dir: apt
        continue-on-error: true
