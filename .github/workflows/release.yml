name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build release binaries for all platforms
  # ──────────────────────────────────────────────
  build-binaries:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: pledgeshield-linux-x86_64
            archive: tar.gz
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: pledgeshield-linux-aarch64
            archive: tar.gz
            use_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: pledgeshield-darwin-aarch64
            archive: tar.gz
            use_cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: pledgeshield-darwin-x86_64
            archive: tar.gz
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: pledgeshield-windows-x86_64
            archive: zip
            use_cross: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl-tools (Linux x86_64)
        if: runner.os == 'Linux' && !matrix.use_cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross

      - name: Build release binary (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build release binary (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz pledgeshield
          cd ../../..
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/pledgeshield.exe -DestinationPath ${{ matrix.artifact }}.zip
          $hash = (Get-FileHash ${{ matrix.artifact }}.zip -Algorithm SHA256).Hash
          "$hash  ${{ matrix.artifact }}.zip" | Out-File -Encoding ascii ${{ matrix.artifact }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256

  # ──────────────────────────────────────────────
  # Job 2: Build .deb packages for apt
  # ──────────────────────────────────────────────
  build-deb:
    name: Build .deb packages
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: pledgeshield-linux-x86_64

      - name: Extract binary
        run: |
          tar xzf pledgeshield-linux-x86_64.tar.gz
          chmod +x pledgeshield

      - name: Install cargo-deb
        run: cargo install cargo-deb || true

      - name: Build .deb package
        run: |
          # Place binary where cargo-deb expects it
          mkdir -p target/release
          cp pledgeshield target/release/pledgeshield
          cargo deb --no-build --output .

      - name: Generate sha256
        run: |
          DEB_FILE=$(ls *.deb | head -1)
          shasum -a 256 "$DEB_FILE" > "$DEB_FILE.sha256"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pledgeshield-deb
          path: |
            *.deb
            *.deb.sha256

  # ──────────────────────────────────────────────
  # Job 3: Create GitHub Release with all binaries
  # ──────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: [build-binaries, build-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.tar.gz.sha256" -o -name "*.zip" -o -name "*.zip.sha256" -o -name "*.deb" -o -name "*.deb.sha256" \) -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PledgeShield v${{ steps.version.outputs.version }}
          body: |
            ## PledgeShield v${{ steps.version.outputs.version }}

            > Personal device security auditor — finds what antivirus misses.

            PledgeShield is a Rust-based host security auditor for Windows, macOS, and Linux. It scans your device for misconfigurations, exposed services, unpatched software, privilege escalation vectors, and other attack surfaces that antivirus software doesn't look at. Includes 95+ active defense modules for hardening your system.

            ### Downloads
            | Platform | File |
            |----------|------|
            | Linux x86_64 | `pledgeshield-linux-x86_64.tar.gz` |
            | Linux aarch64 | `pledgeshield-linux-aarch64.tar.gz` |
            | macOS aarch64 (Apple Silicon) | `pledgeshield-darwin-aarch64.tar.gz` |
            | macOS x86_64 (Intel) | `pledgeshield-darwin-x86_64.tar.gz` |
            | Windows x86_64 | `pledgeshield-windows-x86_64.zip` |
            | Debian/Ubuntu (.deb) | `pledgeshield_*.deb` |

            ### Quick Start

            ```bash
            pledgeshield scan                           # Run a full security audit
            pledgeshield scan --cve --compliance        # Scan with CVE + compliance mapping
            pledgeshield harden firewall --harden       # Harden firewall
            pledgeshield harden posture                 # Check security posture score
            pledgeshield monitor                        # Real-time monitoring
            ```

            ### Install via Package Manager

            **Cargo:**
            ```
            cargo install pledgeshield
            ```

            **Homebrew:**
            ```
            brew install pledgeandgrow/tap/pledgeshield
            ```

            **npm:**
            ```
            npm install -g pledgeshield
            ```

            **PyPI:**
            ```
            pip install pledgeshield
            ```

            **winget:**
            ```
            winget install PledgeAndGrow.PledgeShield
            ```

            **apt (signed repository):**
            ```
            wget -qO - https://pledgeandgrow.github.io/pledgeshield/apt/pledgeshield-apt-public.key | sudo gpg --dearmor -o /usr/share/keyrings/pledgeshield.gpg
            echo "deb [signed-by=/usr/share/keyrings/pledgeshield.gpg] https://pledgeandgrow.github.io/pledgeshield/apt stable main" | sudo tee /etc/apt/sources.list.d/pledgeshield.list
            sudo apt update && sudo apt install pledgeshield
            ```

            **RubyGems:**
            ```
            gem install pledgeshield
            ```

            **NuGet:**
            ```
            dotnet tool install -g PledgeShield
            ```
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # Job 4: Publish to crates.io
  # ──────────────────────────────────────────────
  publish-crates:
    name: Publish to crates.io
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cargo publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

  # ──────────────────────────────────────────────
  # Job 5: Publish npm wrapper package
  # ──────────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create npm wrapper package
        run: |
          mkdir -p npm-pkg/bin
          cat > npm-pkg/package.json << 'PKGJSON'
          {
            "name": "pledgeshield",
            "version": "${{ steps.version.outputs.version }}",
            "description": "Personal device security auditor — finds what antivirus misses. Scans for misconfigurations, exposed services, unpatched CVEs, privilege escalation, and hardens 95+ attack surfaces.",
            "license": "MIT",
            "author": "mehdi-berel",
            "homepage": "https://github.com/pledgeandgrow/pledgeshield",
            "repository": {
              "type": "git",
              "url": "https://github.com/pledgeandgrow/pledgeshield"
            },
            "bugs": {
              "url": "https://github.com/pledgeandgrow/pledgeshield/issues"
            },
            "keywords": [
              "security", "audit", "hardening", "firewall", "privacy",
              "vulnerability", "cve", "compliance", "cis", "stig",
              "pentest", "forensics", "malware", "rootkit", "ransomware",
              "ssh", "tls", "encryption", "network", "endpoint",
              "cross-platform", "cli", "defensive"
            ],
            "bin": {
              "pledgeshield": "bin/pledgeshield.js"
            },
            "engines": {
              "node": ">=14"
            },
            "os": ["linux", "darwin", "win32"],
            "cpu": ["x64", "arm64"]
          }
          PKGJSON

          cat > npm-pkg/README.md << 'NPMREADME'
          # PledgeShield

          > Personal device security auditor for Windows, macOS, and Linux — finds what antivirus misses.

          ## What It Is

          PledgeShield is a Rust-based host security auditor. It scans your device for misconfigurations, exposed services, unpatched software, privilege escalation vectors, and other attack surfaces that antivirus software doesn't look at.

          Think `lynis` — but cross-platform, in Rust, one binary, no agent, no server.

          ## Install

          ```bash
          npm install -g pledgeshield
          ```

          ## Quick Start

          ```bash
          # Run a full security audit
          pledgeshield scan

          # Scan with CVE checking and compliance mapping
          pledgeshield scan --cve --compliance --output html --output-file report.html

          # Harden your system (95+ hardening modules)
          pledgeshield harden firewall --harden --allow-ssh
          pledgeshield harden ports --all
          pledgeshield harden doh --enable cloudflare
          pledgeshield harden sysctl --harden
          pledgeshield harden ssh --harden

          # Real-time monitoring
          pledgeshield monitor

          # Check your security posture score
          pledgeshield harden posture
          ```

          ## What It Detects

          - Exposed services and open ports (RDP, SSH, Telnet, FTP)
          - Unpatched CVEs in installed software
          - Weak SSH configs, password auth, root login
          - Suspicious scheduled tasks, cron jobs, systemd timers
          - World-readable sensitive files (SSH keys, credentials, configs)
          - Missing disk encryption
          - Disabled firewall, UAC, Gatekeeper, AppArmor
          - Rootkit indicators, process injection, hollow processes
          - Ransomware canary files
          - Data exfiltration patterns
          - And 80+ more checks

          ## Active Defense (95+ Modules)

          | Category | Examples |
          |----------|---------|
          | Network | Firewall, DNS-over-HTTPS, ARP detector, rate limiter, geo-IP filter |
          | Privacy | MAC spoofer, telemetry blocker, clipboard guard, metadata stripper |
          | Detection | Rootkit scanner, ransomware canary, intrusion detector, log tampering |
          | Hardening | Sysctl, SSH, SUID scanner, immutable files, mount options |
          | Boot | UEFI/Secure Boot audit, boot log analyzer, TPM checker |
          | Hardware | Thunderbolt guard, webcam guard, microphone mute, FireWire DMA block |

          ## Platforms

          | OS | Support |
          |-----|---------|
          | Linux | Full (x86_64, aarch64) |
          | macOS | Full (Intel, Apple Silicon) |
          | Windows | Full (x86_64) |

          ## License

          MIT
          NPMREADME

          cat > npm-pkg/bin/pledgeshield.js << 'JS'
          #!/usr/bin/env node
          const { platform, arch } = process;
          const { execFileSync } = require('child_process');
          const path = require('path');
          const fs = require('fs');
          const https = require('https');
          const os = require('os');

          const VERSION = require('../package.json').version;
          const REPO = 'pledgeandgrow/pledgeshield';

          const PLATFORM_MAP = {
            'linux-x64': 'pledgeshield-linux-x86_64.tar.gz',
            'linux-arm64': 'pledgeshield-linux-aarch64.tar.gz',
            'darwin-arm64': 'pledgeshield-darwin-aarch64.tar.gz',
            'darwin-x64': 'pledgeshield-darwin-x86_64.tar.gz',
            'win32-x64': 'pledgeshield-windows-x86_64.zip',
          };

          const key = `${platform}-${arch}`;
          const assetName = PLATFORM_MAP[key];

          if (!assetName) {
            console.error(`Unsupported platform: ${key}`);
            process.exit(1);
          }

          const cacheDir = path.join(os.homedir(), '.pledgeshield-bin', VERSION);
          const binPath = path.join(cacheDir, platform === 'win32' ? 'pledgeshield.exe' : 'pledgeshield');

          if (fs.existsSync(binPath)) {
            execFileSync(binPath, process.argv.slice(2), { stdio: 'inherit' });
          } else {
            console.error(`PledgeShield binary not found. Please install via:`);
            console.error(`  curl -sSL https://github.com/${REPO}/releases/latest/download/${assetName} | tar xz`);
            console.error(`Or download from: https://github.com/${REPO}/releases/tag/v${VERSION}`);
            process.exit(1);
          }
          JS
          chmod +x npm-pkg/bin/pledgeshield.js

      - name: Publish to npm
        run: |
          cd npm-pkg
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

  # ──────────────────────────────────────────────
  # Job 6: Publish to PyPI (wrapper package)
  # ──────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Python wrapper package
        run: |
          mkdir -p pypi-pkg/pledgeshield
          cat > pypi-pkg/pyproject.toml << 'TOML'
          [build-system]
          requires = ["setuptools>=61.0"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "pledgeshield"
          version = "${{ steps.version.outputs.version }}"
          description = "Personal device security auditor — finds what antivirus misses. Scans for misconfigurations, exposed services, unpatched CVEs, and hardens 95+ attack surfaces."
          readmes = "README.md"
          license = { text = "MIT" }
          requires-python = ">=3.8"
          authors = [
              { name = "mehdi-berel" }
          ]
          keywords = [
              "security", "audit", "hardening", "firewall", "privacy",
              "vulnerability", "cve", "compliance", "cis", "stig",
              "pentest", "forensics", "malware", "rootkit", "ransomware",
              "ssh", "tls", "encryption", "network", "endpoint",
          ]
          classifiers = [
              "Development Status :: 4 - Beta",
              "Environment :: Console",
              "Intended Audience :: System Administrators",
              "Intended Audience :: Information Technology",
              "License :: OSI Approved :: MIT License",
              "Operating System :: POSIX :: Linux",
              "Operating System :: MacOS :: MacOS X",
              "Operating System :: Microsoft :: Windows",
              "Programming Language :: Python :: 3",
              "Programming Language :: Python :: 3.8",
              "Programming Language :: Python :: 3.9",
              "Programming Language :: Python :: 3.10",
              "Programming Language :: Python :: 3.11",
              "Programming Language :: Python :: 3.12",
              "Topic :: Security",
              "Topic :: System :: Systems Administration",
              "Topic :: Utilities",
          ]

          [project.urls]
          Homepage = "https://github.com/pledgeandgrow/pledgeshield"
          Repository = "https://github.com/pledgeandgrow/pledgeshield"
          Issues = "https://github.com/pledgeandgrow/pledgeshield/issues"

          [project.scripts]
          pledgeshield = "pledgeshield.cli:main"
          TOML

          cat > pypi-pkg/README.md << 'PYPIREADME'
          # PledgeShield

          > Personal device security auditor for Windows, macOS, and Linux — finds what antivirus misses.

          ## What It Is

          PledgeShield is a Rust-based host security auditor. It scans your device for misconfigurations, exposed services, unpatched software, privilege escalation vectors, and other attack surfaces that antivirus software doesn't look at.

          Think `lynis` — but cross-platform, in Rust, one binary, no agent, no server.

          ## Install

          ```bash
          pip install pledgeshield
          ```

          ## Quick Start

          ```bash
          # Run a full security audit
          pledgeshield scan

          # Scan with CVE checking and compliance mapping
          pledgeshield scan --cve --compliance --output html --output-file report.html

          # Harden your system (95+ hardening modules)
          pledgeshield harden firewall --harden --allow-ssh
          pledgeshield harden ports --all
          pledgeshield harden doh --enable cloudflare
          pledgeshield harden sysctl --harden
          pledgeshield harden ssh --harden

          # Real-time monitoring
          pledgeshield monitor

          # Check your security posture score
          pledgeshield harden posture
          ```

          ## What It Detects

          - Exposed services and open ports (RDP, SSH, Telnet, FTP)
          - Unpatched CVEs in installed software
          - Weak SSH configs, password auth, root login
          - Suspicious scheduled tasks, cron jobs, systemd timers
          - World-readable sensitive files (SSH keys, credentials, configs)
          - Missing disk encryption
          - Disabled firewall, UAC, Gatekeeper, AppArmor
          - Rootkit indicators, process injection, hollow processes
          - Ransomware canary files
          - Data exfiltration patterns
          - And 80+ more checks

          ## Active Defense (95+ Modules)

          | Category | Examples |
          |----------|---------|
          | Network | Firewall, DNS-over-HTTPS, ARP detector, rate limiter, geo-IP filter |
          | Privacy | MAC spoofer, telemetry blocker, clipboard guard, metadata stripper |
          | Detection | Rootkit scanner, ransomware canary, intrusion detector, log tampering |
          | Hardening | Sysctl, SSH, SUID scanner, immutable files, mount options |
          | Boot | UEFI/Secure Boot audit, boot log analyzer, TPM checker |
          | Hardware | Thunderbolt guard, webcam guard, microphone mute, FireWire DMA block |

          ## Platforms

          | OS | Support |
          |-----|---------|
          | Linux | Full (x86_64, aarch64) |
          | macOS | Full (Intel, Apple Silicon) |
          | Windows | Full (x86_64) |

          ## License

          MIT
          PYPIREADME

          cat > pypi-pkg/pledgeshield/__init__.py << 'PY'
          """PledgeShield — Personal device security auditor."""
          __version__ = "${{ steps.version.outputs.version }}"
          PY

          cat > pypi-pkg/pledgeshield/cli.py << 'PY'
          import sys
          import os
          import platform
          import subprocess
          import urllib.request
          import tarfile
          import zipfile
          import shutil

          VERSION = "${{ steps.version.outputs.version }}"
          REPO = "pledgeandgrow/pledgeshield"

          PLATFORM_MAP = {
              ("Linux", "x86_64"): "pledgeshield-linux-x86_64.tar.gz",
              ("Linux", "aarch64"): "pledgeshield-linux-aarch64.tar.gz",
              ("Darwin", "arm64"): "pledgeshield-darwin-aarch64.tar.gz",
              ("Darwin", "x86_64"): "pledgeshield-darwin-x86_64.tar.gz",
              ("Windows", "AMD64"): "pledgeshield-windows-x86_64.zip",
          }

          def get_bin_path():
              home = os.path.expanduser("~")
              cache = os.path.join(home, ".pledgeshield-bin", VERSION)
              name = "pledgeshield.exe" if sys.platform == "win32" else "pledgeshield"
              return os.path.join(cache, name)

          def main():
              bin_path = get_bin_path()
              if os.path.exists(bin_path):
                  os.execv(bin_path, [bin_path] + sys.argv[1:])
              else:
                  print(f"PledgeShield v{VERSION} binary not found.")
                  print(f"Download from: https://github.com/{REPO}/releases/tag/v{VERSION}")
                  sys.exit(1)
          PY

      - name: Build and publish
        run: |
          cd pypi-pkg
          pip install build twine
          python -m build
          twine upload dist/* -u __token__ -p ${{ secrets.PYPI_API_TOKEN }}
        continue-on-error: true

  # ──────────────────────────────────────────────
  # Job 7: Publish to RubyGems (wrapper gem)
  # ──────────────────────────────────────────────
  publish-rubygems:
    name: Publish to RubyGems
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Ruby gem
        run: |
          mkdir -p gem-pkg/bin
          cat > gem-pkg/pledgeshield.gemspec << 'GEMSPEC'
            Gem::Specification.new do |s|
              s.name          = "pledgeshield"
              s.version       = "${{ steps.version.outputs.version }}"
              s.summary       = "Personal device security auditor — finds what antivirus misses"
              s.description   = "Personal device security auditor for Windows, macOS, and Linux. Scans for misconfigurations, exposed services, unpatched CVEs, privilege escalation vectors, and hardens 95+ attack surfaces. Think lynis but cross-platform, in Rust, one binary, no agent, no server."
              s.license       = "MIT"
              s.homepage      = "https://github.com/pledgeandgrow/pledgeshield"
              s.metadata      = {
                "homepage_uri"      => "https://github.com/pledgeandgrow/pledgeshield",
                "source_code_uri"   => "https://github.com/pledgeandgrow/pledgeshield",
                "bug_tracker_uri"   => "https://github.com/pledgeandgrow/pledgeshield/issues",
                "changelog_uri"     => "https://github.com/pledgeandgrow/pledgeshield/releases",
              }
              s.author        = "mehdi-berel"
              s.email         = "mehdi.berel@pledgeandgrow.com"
              s.files         = ["bin/pledgeshield", "README.md"]
              s.executables   = ["pledgeshield"]
              s.required_ruby_version = ">= 2.7"
            end
          GEMSPEC

          cat > gem-pkg/README.md << 'GEMREADME'
