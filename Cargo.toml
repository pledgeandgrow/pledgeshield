[package]
name = "pledgeshield"
version = "0.1.0"
edition = "2021"
description = "Personal device security auditor for Windows, macOS, and Linux"
license = "MIT"
repository = "https://github.com/pledgecyber/pledgeshield"

[lib]
name = "pledgeshield"
path = "src/lib.rs"

[[bin]]
name = "pledgeshield"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# HTTP client for CVE APIs
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Misc
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
thiserror = "1"
hostname = "0.4"
toml = "0.8"
indicatif = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }

# Platform-specific
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_UpdateAgent",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Networking_WinSock",
] }
winreg = "0.52"
wmi = "0.14"

[target.'cfg(macos)'.dependencies]
core-foundation = "0.9"
system-configuration = "0.6"
security-framework = "2"

[target.'cfg(linux)'.dependencies]
procfs = "0.16"
nix = { version = "0.29", features = ["user", "process"] }
sysctl = "0.5"

[profile.release]
opt-level = 3
lto = true
strip = true
